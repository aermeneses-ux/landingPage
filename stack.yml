version: '3.9'

services:
  meneses:
    image: ghcr.io/arielmeneses-ux/landinf:2.0.0
    ponetworks:
      - traefik-public
    deploy:
      replicas: 1
      labels:
      - "traefik.enable=true"
      - "traefik.http.routers.meneses.entrypoints=http"
      - "traefik.http.routers.meneses.rule=Host(`meneses.byronrm.com`)"
      - "traefik.http.middlewares.meneses-https-redirect.redirectscheme.scheme=https"
      - "traefik.http.routers.meneses.middlewares=meneses-https-redirect"
      - "traefik.http.routers.meneses-secure.entrypoints=https"
      - "traefik.http.routers.meneses-secure.rule=Host(`meneses.byronrm.com`)"
      - "traefik.http.routers.meneses-secure.tls=true"
      - "traefik.http.routers.meneses-secure.tls.certresolver=http"
      - "traefik.http.routers.meneses-secure.service=meneses"
      - "traefik.http.services.meneses.loadbalancer.server.port=5000"
      - "traefik.docker.network=traefik-public"
networks:
  traefik-public:
    external: true